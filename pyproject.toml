[project]
name = "seaweed-defect-detection"
version = "1.0.0"
description = "김(seaweed) 이물질 검출 — 이진분류에서 유형별 앙상블까지의 실험 기록"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
